[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "statwarrant"
version = "0.1.0"
description = "What your statistical result warrants you to say: equivalence, minimal-effect and zero tests turned into allowed and blocked claims."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Haifaa Owayed" }]
keywords = ["statistics", "equivalence testing", "TOST", "effect size", "interpretation", "reproducibility", "research software"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6", "statsmodels>=0.13"]

[project.urls]
Homepage = "https://github.com/Haifawaeedd/statwarrant"
Issues = "https://github.com/Haifawaeedd/statwarrant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/statwarrant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
