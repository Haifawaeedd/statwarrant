name: Bug report
description: A wrong number, a crash, or output that contradicts itself.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Everything here is public: do not paste confidential or unpublished data. Security problems:
        report them privately (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: statwarrant 0.5.0, Python 3.12, SciPy 1.14, Windows 11
    validations:
      required: true
