name: Bug report
description: A wrong number, a crash, or output that contradicts itself.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: statwarrant 0.1.0, Python 3.12, SciPy 1.14
    validations:
      required: true
