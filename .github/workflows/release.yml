name: release

# Manual, reviewed publishing with PyPI Trusted Publishing (no API token in the repository).
# Nothing is published automatically: a maintainer starts this workflow by hand, chooses
# TestPyPI or PyPI, and (for PyPI) must run it from a version tag such as v0.5.0.
#
# One-time setup (repository owner):
# 1. GitHub: Settings -> Environments -> create "testpypi" and "pypi"; for "pypi" add
#    yourself as a required reviewer, so every PyPI upload waits for your approval.
# 2. test.pypi.org and pypi.org: Account -> Publishing -> add a pending publisher with
#    project statwarrant, owner Haifawaeedd, repository statwarrant, workflow release.yml,
#    and environment testpypi (on TestPyPI) or pypi (on PyPI).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version
        env:
          TARGET: ${{ inputs.target }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version $version, ref ${GITHUB_REF}"
          if [ "$TARGET" = "pypi" ]; then
            test "${GITHUB_REF}" = "refs/tags/v$version" || { echo "PyPI uploads must run from tag v$version"; exit 1; }
            case "$version" in *dev*) echo "development versions are not uploaded to PyPI"; exit 1;; esac
          fi
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/statwarrant/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/statwarrant/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
