name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pytest-cov
      - name: Test with coverage
        run: pytest --cov=statwarrant --cov-report=term-missing

  oldest-dependencies:
    # The lowest versions pyproject.toml promises to support.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install oldest supported NumPy and SciPy
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.22.4" "scipy==1.11.4" "statsmodels==0.14.0" "pandas<2.1" pytest hypothesis
          pip install --no-deps -e .
      - name: Test
        run: pytest

  package:
    # Build the sdist and wheel, then install the wheel in a clean environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel outside the source tree and test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest hypothesis statsmodels
          cp -r tests /tmp/wheel-tests
          cd /tmp && /tmp/clean/bin/python -c "import statwarrant, sys; print(statwarrant.__version__, statwarrant.__file__)"
          cd /tmp && /tmp/clean/bin/python -m pytest -q /tmp/wheel-tests -p no:cacheprovider --rootdir /tmp/wheel-tests
